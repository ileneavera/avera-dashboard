<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avera — VC Network Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f8f9fc;
            --surface: #ffffff;
            --surface-2: #f1f3f8;
            --border: #e5e7ef;
            --text: #1a1d2e;
            --text-dim: #6b7194;
            --accent: #6c5ce7;
            --accent-light: #ebe8ff;
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .app { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 300px;
            min-width: 300px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-size: 17px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .sidebar-header p {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 14px;
        }
        .search-box {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--surface-2);
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }
        .search-box:focus { border-color: var(--accent); }
        .search-box::placeholder { color: var(--text-dim); }

        .vc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .vc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.12s;
            font-size: 13px;
            font-weight: 500;
        }
        .vc-item:hover { background: var(--surface-2); }
        .vc-item.active { background: var(--accent-light); color: var(--accent); }
        .vc-item .vc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vc-count {
            background: var(--surface-2);
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            min-width: 24px;
            text-align: center;
        }
        .vc-item.active .vc-count { background: var(--accent); color: white; }

        /* Main Panel */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            text-align: center;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
        .empty-state h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .empty-state p { font-size: 13px; max-width: 360px; line-height: 1.5; }

        /* VC Detail Header */
        .vc-header {
            margin-bottom: 28px;
        }
        .vc-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .vc-header .subtitle {
            font-size: 13px;
            color: var(--text-dim);
        }

        /* Section Titles */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-dim);
            margin-bottom: 14px;
            margin-top: 32px;
        }
        .section-title:first-of-type { margin-top: 0; }

        /* Prospect Cards */
        .prospect-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }
        .prospect-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.15s, border-color 0.15s;
        }
        .prospect-card:hover { box-shadow: var(--shadow); border-color: var(--accent-light); }
        .prospect-card .company-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .prospect-card .detail-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }
        .prospect-card .detail-row .label {
            font-weight: 600;
            color: var(--text);
            min-width: 56px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-badge.status-active,
        .status-badge.status-researching { background: rgba(16,185,129,0.1); color: var(--green); }
        .status-badge.status-outreach,
        .status-badge.status-contacted { background: rgba(108,92,231,0.1); color: var(--accent); }
        .status-badge.status-meeting,
        .status-badge.status-negotiating { background: rgba(245,158,11,0.1); color: var(--amber); }
        .status-badge.status-closed,
        .status-badge.status-passed { background: rgba(239,68,68,0.1); color: var(--red); }
        .status-badge.status-default { background: var(--surface-2); color: var(--text-dim); }

        /* Overlap Badge */
        .overlap-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(108,92,231,0.1);
            color: var(--accent);
        }
        .overlap-badge .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* Warm Intro Section */
        .intro-paths {
            margin-top: 32px;
        }
        .intro-card {
            background: var(--accent-light);
            border: 1px solid rgba(108,92,231,0.15);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 10px;
        }
        .intro-card .intro-headline {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .intro-card .intro-detail {
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.5;
        }
        .intro-card .shared-vcs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .intro-card .shared-vc-tag {
            background: var(--surface);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .strong-overlap-label {
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 6px;
        }

        /* No Data Banner */
        .no-data-banner {
            background: var(--accent-light);
            border: 1px solid rgba(108,92,231,0.2);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            margin: 20px;
        }
        .no-data-banner h3 { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
        .no-data-banner p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
        .no-data-banner code {
            background: var(--surface);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>VC Network Tracker</h1>
                <p id="sidebar-subtitle">Loading...</p>
                <input type="text" class="search-box" id="vc-search" placeholder="Search VC firms...">
            </div>
            <div class="vc-list" id="vc-list"></div>
        </aside>
        <main class="main" id="main-panel">
            <div class="empty-state" id="empty-state">
                <div class="icon">&#9878;</div>
                <h2>Select a VC firm</h2>
                <p>Choose a VC from the sidebar to see connected prospects, shared networks, and warm intro paths.</p>
            </div>
        </main>
    </div>

<script>
const STORAGE_KEY = 'avera-prospects';

function loadProspects() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { return []; }
}

function parseVCs(leadInvestors) {
    if (!leadInvestors || typeof leadInvestors !== 'string') return [];
    return leadInvestors
        .split(',')
        .map(v => v.trim())
        .filter(v => v.length > 0);
}

function buildVCMap(prospects) {
    const map = {};
    prospects.forEach(p => {
        const vcs = parseVCs(p.leadInvestors);
        vcs.forEach(vc => {
            if (!map[vc]) map[vc] = [];
            map[vc].push(p);
        });
    });
    return map;
}

function getProspectVCs(prospect) {
    return parseVCs(prospect.leadInvestors);
}

function getSharedVCs(p1, p2) {
    const vcs1 = new Set(getProspectVCs(p1));
    const vcs2 = getProspectVCs(p2);
    return vcs2.filter(v => vcs1.has(v));
}

function statusClass(status) {
    if (!status) return 'status-default';
    const s = status.toLowerCase().replace(/\s+/g, '-');
    const known = ['active', 'researching', 'outreach', 'contacted', 'meeting', 'negotiating', 'closed', 'passed'];
    for (const k of known) {
        if (s.includes(k)) return 'status-' + k;
    }
    return 'status-default';
}

// State
let vcMap = {};
let sortedVCs = [];
let selectedVC = null;

function init() {
    const prospects = loadProspects();
    vcMap = buildVCMap(prospects);
    sortedVCs = Object.keys(vcMap).sort((a, b) => vcMap[b].length - vcMap[a].length);

    const subtitle = document.getElementById('sidebar-subtitle');
    if (sortedVCs.length === 0) {
        subtitle.textContent = 'No VC data found';
        document.getElementById('vc-list').innerHTML =
            '<div class="no-data-banner">' +
            '<h3>No prospects loaded</h3>' +
            '<p>This tracker reads from <code>localStorage</code> key <code>avera-prospects</code>. ' +
            'Add prospects with a <code>leadInvestors</code> field in the Prospect Tracker first.</p></div>';
        return;
    }

    subtitle.textContent = sortedVCs.length + ' VC firms across ' + prospects.length + ' prospects';
    renderVCList(sortedVCs);
}

function renderVCList(vcs) {
    const list = document.getElementById('vc-list');
    list.innerHTML = '';
    vcs.forEach(vc => {
        const item = document.createElement('div');
        item.className = 'vc-item' + (selectedVC === vc ? ' active' : '');
        item.innerHTML =
            '<span class="vc-name">' + escapeHtml(vc) + '</span>' +
            '<span class="vc-count">' + vcMap[vc].length + '</span>';
        item.addEventListener('click', () => selectVC(vc));
        list.appendChild(item);
    });
}

function selectVC(vc) {
    selectedVC = vc;
    filterVCList();
    renderDetail(vc);
}

function filterVCList() {
    const query = document.getElementById('vc-search').value.toLowerCase();
    const filtered = sortedVCs.filter(vc => vc.toLowerCase().includes(query));
    renderVCList(filtered);
}

function renderDetail(vc) {
    const panel = document.getElementById('main-panel');
    const prospects = vcMap[vc];

    let html = '';

    // Header
    html += '<div class="vc-header">';
    html += '<h2>' + escapeHtml(vc) + '</h2>';
    html += '<span class="subtitle">Connected to ' + prospects.length + ' prospect' + (prospects.length !== 1 ? 's' : '') + ' in your pipeline</span>';
    html += '</div>';

    // Connected Prospects
    html += '<div class="section-title">Connected Prospects</div>';
    html += '<div class="prospect-grid">';

    // Precompute overlaps for each prospect (with other prospects in this VC's list)
    const overlapData = {};
    prospects.forEach((p, i) => {
        const overlaps = [];
        prospects.forEach((q, j) => {
            if (i === j) return;
            const shared = getSharedVCs(p, q);
            if (shared.length >= 2) {
                overlaps.push({ prospect: q, shared: shared });
            }
        });
        overlapData[p.id || i] = overlaps;
    });

    prospects.forEach((p, i) => {
        const key = p.id || i;
        const overlaps = overlapData[key];
        html += '<div class="prospect-card">';
        html += '<div class="company-name">' + escapeHtml(p.companyName || 'Unnamed') + '</div>';
        html += '<div class="detail-row"><span class="label">Sector</span>' + escapeHtml(p.sector || '---') + '</div>';
        html += '<div class="detail-row"><span class="label">Stage</span>' + escapeHtml(p.stage || '---') + '</div>';
        html += '<div class="detail-row"><span class="label">Funding</span>' + escapeHtml(p.fundingAmount || '---') + '</div>';
        html += '<div class="detail-row"><span class="label">Status</span><span class="status-badge ' + statusClass(p.status) + '">' + escapeHtml(p.status || 'Unknown') + '</span></div>';

        if (overlaps.length > 0) {
            const names = overlaps.map(o => escapeHtml(o.prospect.companyName || 'Unnamed')).join(', ');
            html += '<div class="overlap-badge"><span class="dot"></span>Strong network overlap with ' + names + '</div>';
        }

        html += '</div>';
    });
    html += '</div>';

    // Warm Intro Paths
    const introPairs = [];
    const seen = new Set();
    prospects.forEach((p, i) => {
        prospects.forEach((q, j) => {
            if (i >= j) return;
            const pairKey = [p.companyName, q.companyName].sort().join('|||');
            if (seen.has(pairKey)) return;
            const shared = getSharedVCs(p, q);
            // They share the current VC, so at least 1 shared. Show all pairs that share this VC.
            if (shared.length >= 1) {
                seen.add(pairKey);
                introPairs.push({ a: p, b: q, shared: shared });
            }
        });
    });

    if (introPairs.length > 0) {
        html += '<div class="intro-paths">';
        html += '<div class="section-title">Warm Intro Paths</div>';

        introPairs.forEach(pair => {
            const isStrong = pair.shared.length >= 2;
            html += '<div class="intro-card">';
            html += '<div class="intro-headline">' +
                escapeHtml(pair.a.companyName || 'Unnamed') + ' &harr; ' +
                escapeHtml(pair.b.companyName || 'Unnamed');
            if (isStrong) {
                html += '<span class="strong-overlap-label">Strong Overlap</span>';
            }
            html += '</div>';
            html += '<div class="intro-detail">' +
                'These two prospects share ' + pair.shared.length + ' VC investor' + (pair.shared.length !== 1 ? 's' : '') +
                '. A warm intro through any shared VC could open doors for both relationships.</div>';
            html += '<div class="shared-vcs">';
            pair.shared.forEach(v => {
                html += '<span class="shared-vc-tag">' + escapeHtml(v) + '</span>';
            });
            html += '</div>';
            html += '</div>';
        });

        html += '</div>';
    }

    panel.innerHTML = html;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Events
document.getElementById('vc-search').addEventListener('input', filterVCList);

// Boot
init();
</script>
</body>
</html>
