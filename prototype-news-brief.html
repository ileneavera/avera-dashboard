<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #f8f9fc;
      --surface: #ffffff;
      --surface-2: #f1f3f8;
      --border: #e5e7ef;
      --text: #1a1d2e;
      --text-dim: #6b7194;
      --accent: #6c5ce7;
      --accent-light: #ebe8ff;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .header .date {
      font-size: 15px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .header .sample-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--amber);
      background: #fef3c7;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 12px;
    }

    /* Action bar */
    .action-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: #5b4bd5;
      border-color: #5b4bd5;
      color: #fff;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Section */
    .section {
      margin-bottom: 32px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .section-icon.deals { background: #ede9fe; }
    .section-icon.funding { background: #d1fae5; }
    .section-icon.pipeline { background: var(--accent-light); }
    .section-icon.signals { background: #fef3c7; }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .section-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--surface-2);
      padding: 2px 10px;
      border-radius: 20px;
      margin-left: auto;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card-header {
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      user-select: none;
    }

    .card-header:hover {
      background: var(--surface-2);
    }

    .card-chevron {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-top: 2px;
      color: var(--text-dim);
      transition: transform 0.2s ease;
    }

    .card.open .card-chevron {
      transform: rotate(90deg);
    }

    .card-main {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .card-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .tag-amount {
      background: #d1fae5;
      color: #065f46;
    }

    .tag-sector {
      background: var(--accent-light);
      color: var(--accent);
    }

    .tag-round {
      background: #fef3c7;
      color: #92400e;
    }

    .card-detail {
      display: none;
      padding: 0 20px 16px 54px;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.7;
    }

    .card.open .card-detail {
      display: block;
    }

    /* Pipeline matches */
    .pipeline-match {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 10px;
    }

    .pipeline-match-sector {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .pipeline-match-prospects {
      font-size: 13px;
      color: var(--text-dim);
    }

    .pipeline-match-prospects strong {
      color: var(--text);
      font-weight: 600;
    }

    .pipeline-empty {
      background: var(--surface);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    .pipeline-empty code {
      background: var(--surface-2);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    /* Signal cards */
    .signal-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .signal-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px;
    }

    .signal-indicator.up { background: var(--green); }
    .signal-indicator.neutral { background: var(--amber); }
    .signal-indicator.down { background: var(--red); }

    .signal-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.5;
    }

    .signal-detail {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1.5px solid var(--border);
    }

    .footer-note {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    /* Print styles */
    @media print {
      body { background: #fff; }
      .container { padding: 0; max-width: 100%; }
      .action-bar, .toast, .footer-note { display: none; }
      .card { break-inside: avoid; border: 1px solid #ddd; }
      .card.open .card-detail { display: block; }
      .card-header:hover { background: none; }
      .signal-card { break-inside: avoid; }
      .section { break-inside: avoid; }
    }

    @media (max-width: 600px) {
      .container { padding: 20px 14px 48px; }
      .header h1 { font-size: 22px; }
      .card-header { padding: 14px 16px; }
      .card-detail { padding: 0 16px 14px 46px; }
    }
  </style>
</head>

// ── Helpers ──

function getToday() {
  const d = new Date();
  return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(arr, n) {
  return shuffle(arr).slice(0, n);
}

function chevronSVG() {
  return '<svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
}

function toggleCard(el) {
  el.closest('.card').classList.toggle('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

      <div class="pipeline-empty">
        No prospects found. Add prospects to <code>localStorage</code> key <code>"avera-prospects"</code> as JSON.<br>
        <span style="margin-top:8px;display:inline-block;font-size:11px;color:var(--text-dim);">
          Format: <code>[{"name":"Acme Health","sector":"Behavioral Health"}, ...]</code>
        </span>
      </div>`;
  } else {
    try {
      const prospects = JSON.parse(raw);
      const newsSectors = new Set();
      deals.forEach(d => newsSectors.add(d.sector));
      funding.forEach(f => newsSectors.add(f.sector));

      const matches = {};
      prospects.forEach(p => {
        const s = p.sector || '';
        if (newsSectors.has(s)) {
          if (!matches[s]) matches[s] = [];
          matches[s].push(p.name);
        }
      });

      const sectors = Object.keys(matches);
      if (sectors.length === 0) {
        html += `<div class="pipeline-empty">No sector matches between today's news and your pipeline prospects.</div>`;
      } else {
        sectors.forEach(s => {
          html += `
            <div class="pipeline-match">
              <div class="pipeline-match-sector">${s}</div>
              <div class="pipeline-match-prospects">
                Pipeline prospects: <strong>${matches[s].join('</strong>, <strong>')}</strong>
              </div>
            </div>`;
        });
      }
    } catch (e) {
      html += `<div class="pipeline-empty">Error parsing avera-prospects from localStorage. Ensure it's valid JSON.</div>`;
    }
  }

  html += '</div>';
  document.getElementById('pipeline-section').innerHTML = html;
}

function renderSignals(signals) {
  currentSignals = signals;
  let html = `
    <div class="section">
      <div class="section-header">
        <div class="section-icon signals">&#128225;</div>
        <div class="section-title">Market Signals</div>
      </div>`;
  signals.forEach(s => {
    html += `
      <div class="signal-card">
        <div class="signal-indicator ${s.direction}"></div>
        <div>
          <div class="signal-text">${s.text}</div>
          <div class="signal-detail">${s.detail}</div>
        </div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('signals-section').innerHTML = html;
}

function renderAll() {
  const deals = pick(ALL_DEALS, 5);
  const funding = pick(ALL_FUNDING, 5);
  const signals = pick(ALL_SIGNALS, 3);

  renderDeals(deals);
  renderFunding(funding);
  renderPipeline(deals, funding);
  renderSignals(signals);
}

function refreshBrief() {
  renderAll();
  showToast('Brief refreshed with new sample data');
}

function shareBrief() {
  let text = `AVERA MORNING BRIEF\n${getToday()}\n${'─'.repeat(40)}\n\n`;

  text += `M&A DEALS\n`;
  currentDeals.forEach(d => {
    text += `  ${d.acquirer} → ${d.target} (${d.size}) — ${d.sector}\n  ${d.summary}\n\n`;
  });

  text += `FUNDRAISING ROUNDS\n`;
  currentFunding.forEach(r => {
    text += `  ${r.company} — ${r.round} — ${r.amount} (led by ${r.lead}) — ${r.sector}\n`;
  });

  text += `\nMARKET SIGNALS\n`;
  currentSignals.forEach(s => {
    const arrow = s.direction === 'up' ? '↑' : s.direction === 'down' ? '↓' : '→';
    text += `  ${arrow} ${s.text}\n`;
  });

  text += `\n${'─'.repeat(40)}\nSample data — connect API for live brief.\n`;

  navigator.clipboard.writeText(text).then(() => {
    showToast('Plain-text brief copied to clipboard');
  }).catch(() => {
    showToast('Could not copy — check clipboard permissions');
  });
}

// ── Init ──
document.getElementById('brief-date').textContent = getToday();
renderAll();
</script>

</body>
</html>
