<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avera — Meeting Notes Processor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f8f9fc;
            --surface: #ffffff;
            --surface-2: #f1f3f8;
            --border: #e5e7ef;
            --border-hover: #c8ccd8;
            --text: #1a1d2e;
            --text-dim: #6b7194;
            --accent: #6c5ce7;
            --accent-light: #ebe8ff;
            --accent-soft: rgba(108,92,231,0.08);
            --green: #10b981;
            --green-soft: rgba(16,185,129,0.08);
            --amber: #f59e0b;
            --amber-soft: rgba(245,158,11,0.08);
            --red: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        button { cursor: pointer; font-family: inherit; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header .logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
        }
        .header p {
            font-size: 15px;
            color: var(--text-dim);
        }

        /* API Key */
        .api-key-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .api-key-bar label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap;
        }
        .api-key-bar input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            background: var(--surface);
            color: var(--text);
            transition: border-color 0.2s;
        }
        .api-key-bar input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* Input Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
        }
        textarea {
            width: 100%;
            min-height: 220px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            background: var(--surface-2);
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        textarea::placeholder {
            color: var(--text-dim);
        }

        /* Button */
        .btn-process {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 12px 28px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-process:hover { background: #5b4bd5; }
        .btn-process:active { transform: scale(0.98); }
        .btn-process:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error */
        .error-msg {
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: var(--radius-sm);
            color: var(--red);
            font-size: 13px;
            display: none;
        }

        /* Output Card */
        .output-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: none;
        }
        .output-header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .output-header h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .output-header .date-badge {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--surface-2);
            padding: 5px 12px;
            border-radius: 20px;
        }
        .output-body {
            padding: 28px;
        }

        .section {
            margin-bottom: 28px;
        }
        .section:last-child { margin-bottom: 0; }
        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .attendees {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .attendee-chip {
            font-size: 13px;
            font-weight: 500;
            padding: 5px 12px;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: 20px;
        }
        .bullet-list {
            list-style: none;
            padding: 0;
        }
        .bullet-list li {
            position: relative;
            padding-left: 18px;
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }
        .bullet-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 9px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* Follow-ups Table */
        .followups-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .followups-table th {
            text-align: left;
            font-weight: 600;
            color: var(--text-dim);
            padding: 8px 12px;
            border-bottom: 2px solid var(--border);
            font-size: 12px;
        }
        .followups-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .followups-table tr:last-child td { border-bottom: none; }
        .owner-badge {
            font-weight: 600;
            color: var(--accent);
        }
        .due-date {
            font-size: 12px;
            color: var(--text-dim);
            background: var(--amber-soft);
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
        }

        /* Milestones */
        .milestone-list {
            list-style: none;
            padding: 0;
        }
        .milestone-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .milestone-list li:last-child { border-bottom: none; }
        .milestone-date {
            font-size: 12px;
            font-weight: 600;
            color: var(--green);
            background: var(--green-soft);
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Avera</div>
            <h1>Meeting Notes Processor</h1>
            <p>Paste raw meeting notes and let AI structure them for your deal file.</p>
        </div>

        <div class="api-key-bar">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="sk-ant-..." />
        </div>

        <div class="card">
            <div class="card-title">Raw Meeting Notes</div>
            <textarea id="rawNotes" placeholder="Paste your meeting notes here...&#10;&#10;Example:&#10;Call with Acme Corp team on March 28. John (CEO), Sarah (CFO), and our team Mike and Lisa joined.&#10;Discussed revenue trends, integration timeline, and key risks around customer concentration..."></textarea>
            <button class="btn-process" id="processBtn" onclick="processNotes()">
                <span id="btnText">Process Notes</span>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <div class="output-card" id="outputCard">
            <div class="output-header">
                <h2 id="dealName"></h2>
                <span class="date-badge" id="meetingDate"></span>
            </div>
            <div class="output-body" id="outputBody"></div>
        </div>
    </div>

    <script>
        async function processNotes() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const rawNotes = document.getElementById('rawNotes').value.trim();
            const btn = document.getElementById('processBtn');
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMsg');
            const outputCard = document.getElementById('outputCard');

            errorMsg.style.display = 'none';

            if (!apiKey) {
                showError('Please enter your Anthropic API key.');
                return;
            }
            if (!rawNotes) {
                showError('Please paste some meeting notes first.');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Processing...';
            btnText.style.display = 'inline-flex';
            btnText.style.alignItems = 'center';
            btnText.style.gap = '8px';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 2048,
                        system: `You are an M&A deal assistant for Avera. Given raw meeting notes, extract and structure them into JSON. Return ONLY valid JSON with no markdown formatting, no code fences, and no extra text. The JSON must have these fields:
- "dealName": string (the deal or target company name, inferred if not explicit)
- "date": string (meeting date in a readable format)
- "attendees": array of strings (names and roles if mentioned)
- "keyPoints": array of strings (key discussion points as concise bullets)
- "followUps": array of objects with {"task": string, "owner": string, "dueDate": string} (action items with responsible person and deadline; infer reasonable due dates if not stated)
- "milestones": array of objects with {"milestone": string, "date": string} (upcoming timeline items or next steps with target dates)

If any field cannot be determined, use reasonable placeholders like "TBD" rather than omitting the field.`,
                        messages: [
                            { role: 'user', content: rawNotes }
                        ]
                    })
                });

                if (!response.ok) {
                    const errBody = await response.json().catch(() => ({}));
                    throw new Error(errBody.error?.message || `API returned ${response.status}`);
                }

                const data = await response.json();
                const text = data.content[0].text;
                const structured = JSON.parse(text);
                renderOutput(structured);
            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                btnText.innerHTML = 'Process Notes';
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function renderOutput(data) {
            const outputCard = document.getElementById('outputCard');
            document.getElementById('dealName').textContent = data.dealName || 'Untitled Deal';
            document.getElementById('meetingDate').textContent = data.date || 'Date TBD';

            const body = document.getElementById('outputBody');
            body.innerHTML = '';

            // Attendees
            if (data.attendees && data.attendees.length > 0) {
                body.innerHTML += `
                    <div class="section">
                        <div class="section-label">Attendees</div>
                        <div class="attendees">
                            ${data.attendees.map(a => `<span class="attendee-chip">${escapeHtml(a)}</span>`).join('')}
                        </div>
                    </div>`;
            }

            // Key Discussion Points
            if (data.keyPoints && data.keyPoints.length > 0) {
                body.innerHTML += `
                    <div class="section">
                        <div class="section-label">Key Discussion Points</div>
                        <ul class="bullet-list">
                            ${data.keyPoints.map(p => `<li>${escapeHtml(p)}</li>`).join('')}
                        </ul>
                    </div>`;
            }

            // Follow-ups
            if (data.followUps && data.followUps.length > 0) {
                body.innerHTML += `
                    <div class="section">
                        <div class="section-label">Follow-ups</div>
                        <table class="followups-table">
                            <thead>
                                <tr><th>Task</th><th>Owner</th><th>Due</th></tr>
                            </thead>
                            <tbody>
                                ${data.followUps.map(f => `
                                    <tr>
                                        <td>${escapeHtml(f.task)}</td>
                                        <td><span class="owner-badge">${escapeHtml(f.owner)}</span></td>
                                        <td><span class="due-date">${escapeHtml(f.dueDate)}</span></td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
            }

            // Milestones
            if (data.milestones && data.milestones.length > 0) {
                body.innerHTML += `
                    <div class="section">
                        <div class="section-label">Timeline / Next Milestones</div>
                        <ul class="milestone-list">
                            ${data.milestones.map(m => `
                                <li>
                                    <span class="milestone-date">${escapeHtml(m.date)}</span>
                                    <span>${escapeHtml(m.milestone)}</span>
                                </li>`).join('')}
                        </ul>
                    </div>`;
            }

            outputCard.style.display = 'block';
            outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
