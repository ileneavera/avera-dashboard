<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avera — Prospect Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f5f0e8;
            --surface: #faf6ef;
            --surface-2: #ede8df;
            --border: #ddd7cb;
            --border-hover: #c4bdb0;
            --text: #1a1a1a;
            --text-dim: #6b635a;
            --accent: #e8618c;
            --accent-light: #fce8ef;
            --accent-soft: rgba(232,97,140,0.08);
            --green: #4a8c6f;
            --green-soft: rgba(74,140,111,0.10);
            --amber: #c4943a;
            --amber-soft: rgba(196,148,58,0.10);
            --red: #c4453a;
            --red-soft: rgba(196,69,58,0.08);
            --radius: 4px;
            --radius-sm: 3px;
            --shadow-sm: none;
            --shadow: none;
            --shadow-lg: 0 24px 64px rgba(0,0,0,0.10);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
            line-height: 1.6;
            letter-spacing: 0;
        }
        button { cursor: pointer; font-family: inherit; border: none; background: none; }
        input, textarea, select { font-family: inherit; }

        /* Layout */
        .app { display: flex; height: 100vh; }
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
            font-family: 'Playfair Display', Georgia, serif;
            letter-spacing: 0;
        }
        .sidebar-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .sidebar-actions button {
            flex: 1;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .btn-primary {
            background: var(--text);
            color: var(--bg);
        }
        .btn-primary:hover { background: #333; }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--surface-2); border-color: var(--border-hover); }
        .search-box {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: all 0.15s;
            background: var(--bg);
        }
        .search-box:focus { border-color: var(--text); }
        .filter-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .filter-row select {
            flex: 1;
            padding: 7px 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: var(--surface);
            outline: none;
            color: var(--text);
        }

        /* Prospect list */
        .prospect-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .prospect-item {
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .prospect-item:hover { background: var(--surface-2); }
        .prospect-item.active { background: var(--accent-light); border-left: 3px solid var(--accent); }
        .prospect-item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .prospect-item-meta {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .status-researching { background: var(--accent-soft); color: var(--accent); }
        .status-contacted { background: var(--amber-soft); color: var(--amber); }
        .status-followed-up { background: rgba(196,148,58,0.15); color: #8a6d20; }
        .status-meeting-scheduled { background: var(--green-soft); color: var(--green); }
        .status-engaged { background: rgba(74,140,111,0.15); color: #3a7359; }
        .status-closed { background: var(--surface-2); color: var(--text-dim); }
        .status-passed { background: var(--red-soft); color: var(--red); }

        /* Follow-ups section */
        .followups-section {
            border-top: 1px solid var(--border);
            max-height: 280px;
            overflow-y: auto;
        }
        .followups-header {
            padding: 14px 20px 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: sticky;
            top: 0;
            background: var(--surface);
        }
        .followup-item {
            padding: 10px 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .followup-item:hover { background: var(--surface-2); }
        .followup-item.overdue { color: var(--red); }
        .followup-item.due-soon { color: #b45309; }
        .followup-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .followup-dot.overdue { background: var(--red); }
        .followup-dot.due-soon { background: var(--amber); }
        .followup-dot.upcoming { background: var(--green); }
        .followup-text { flex: 1; }
        .followup-company { font-weight: 600; }
        .followup-date { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

        /* Main content */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            font-size: 15px;
        }
        .empty-state span { font-size: 48px; margin-bottom: 16px; }

        /* Company profile */
        .profile-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .profile-header h2 { font-size: 28px; font-weight: 600; font-family: 'Playfair Display', Georgia, serif; letter-spacing: 0; }
        .profile-header-actions { display: flex; gap: 8px; }
        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
        }
        .profile-card h3 {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .profile-field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .profile-field .value {
            font-size: 14px;
            line-height: 1.5;
        }
        .profile-field.full { grid-column: 1 / -1; }
        .profile-field .value a {
            color: var(--accent);
            text-decoration: underline;
        }
        .profile-field .value a:hover { opacity: 0.8; }

        /* Meeting cards */
        .meetings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .meetings-header h3 {
            font-size: 16px;
            font-weight: 600;
            font-family: 'Playfair Display', Georgia, serif;
        }
        .meeting-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
        }
        .meeting-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .meeting-date {
            font-size: 14px;
            font-weight: 600;
        }
        .meeting-attendees {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .meeting-notes {
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }
        .followup-checklist { list-style: none; }
        .followup-checklist li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
        }
        .followup-checklist input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--accent);
        }
        .followup-checklist .completed {
            text-decoration: line-through;
            color: var(--text-dim);
        }
        .followup-deadline {
            font-size: 11px;
            color: var(--text-dim);
            margin-left: auto;
            white-space: nowrap;
        }
        .followup-deadline.overdue { color: var(--red); font-weight: 600; }
        .followup-deadline.due-soon { color: var(--amber); font-weight: 600; }
        .meeting-delete-btn {
            font-size: 12px;
            color: var(--text-dim);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .meeting-delete-btn:hover { background: var(--red-soft); color: var(--red); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.15s;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.2s ease-out;
            border: 1px solid var(--border);
        }
        .modal h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 28px;
            font-family: 'Playfair Display', Georgia, serif;
            letter-spacing: 0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: all 0.15s;
            background: var(--bg);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus { border-color: var(--text); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 24px;
        }
        .modal-actions button {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
        }
        .btn-cancel {
            background: var(--surface-2);
            color: var(--text);
        }
        .btn-cancel:hover { background: var(--border); }
        .btn-save {
            background: var(--text);
            color: var(--bg);
        }
        .btn-save:hover { background: #333; }
        .btn-danger {
            background: var(--red);
            color: var(--bg);
        }
        .btn-danger:hover { background: #a33830; }

        /* Dynamic follow-up rows in modal */
        .followup-rows { margin-top: 8px; }
        .followup-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .followup-row input[type="text"] { flex: 1; }
        .followup-row input[type="date"] { width: 160px; }
        .followup-row .remove-followup {
            color: var(--red);
            font-size: 18px;
            padding: 4px;
        }
        .add-followup-btn {
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
            padding: 6px 0;
        }
        .add-followup-btn:hover { text-decoration: underline; }

        /* Import area */
        .import-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .import-area:hover { border-color: var(--accent); }
        .import-area input { display: none; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
    </style>
</head>
<body>
<div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Avera Prospects</h1>
            <div class="sidebar-actions">
                <button class="btn-primary" onclick="openProspectModal()">+ New</button>
                <button class="btn-secondary" onclick="openImportModal()">Import CSV</button>
                <button class="btn-secondary" onclick="exportJSON()">Export</button>
            </div>
            <input type="text" class="search-box" placeholder="Search name, sector, contact..." id="searchInput" oninput="renderSidebar()">
            <div class="filter-row">
                <select id="statusFilter" onchange="renderSidebar()">
                    <option value="">All Statuses</option>
                    <option value="Researching">Researching</option>
                    <option value="Contacted">Contacted</option>
                    <option value="Followed Up">Followed Up</option>
                    <option value="Meeting Scheduled">Meeting Scheduled</option>
                    <option value="Engaged">Engaged</option>
                    <option value="Closed">Closed</option>
                    <option value="Passed">Passed</option>
                </select>
                <select id="sectorFilter" onchange="renderSidebar()">
                    <option value="">All Sectors</option>
                </select>
            </div>
        </div>
        <div class="prospect-list" id="prospectList"></div>
        <div class="followups-section" id="followupsSection"></div>
    </div>

    <!-- Main -->
    <div class="main" id="mainContent">
        <div class="empty-state">
            <span>&#128203;</span>
            Select a prospect or add a new one
        </div>
    </div>
</div>

<!-- Prospect Modal -->
<div class="modal-overlay" id="prospectModal" style="display:none" onclick="if(event.target===this)closeModal('prospectModal')">
    <div class="modal">
        <h2 id="prospectModalTitle">Add Prospect</h2>
        <input type="hidden" id="pf-id">
        <div class="form-row">
            <div class="form-group"><label>Company Name *</label><input id="pf-companyName" required></div>
            <div class="form-group"><label>Website</label><input id="pf-website"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>HQ</label><input id="pf-hq"></div>
            <div class="form-group"><label>NYC-Based</label>
                <select id="pf-nycBased"><option value="">--</option><option value="Yes">Yes</option><option value="No">No</option></select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Sector</label><input id="pf-sector"></div>
            <div class="form-group"><label>Subsector</label><input id="pf-subsector"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Stage</label>
                <select id="pf-stage">
                    <option value="">--</option>
                    <option>Seed</option><option>Series A</option><option>Series B</option>
                    <option>Series C</option><option>Series D</option><option>Growth Equity</option><option>Growth</option>
                </select>
            </div>
            <div class="form-group"><label>Funding Amount</label><input id="pf-fundingAmount"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Funding Date</label><input id="pf-fundingDate"></div>
            <div class="form-group"><label>Lead Investors</label><input id="pf-leadInvestors"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Lead Contact</label><input id="pf-leadContact"></div>
            <div class="form-group"><label>Contact Title</label><input id="pf-contactTitle"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Year Founded</label><input id="pf-yearFounded"></div>
            <div class="form-group"><label>Status</label>
                <select id="pf-status">
                    <option value="Researching">Researching</option>
                    <option value="Contacted">Contacted</option>
                    <option value="Followed Up">Followed Up</option>
                    <option value="Meeting Scheduled">Meeting Scheduled</option>
                    <option value="Engaged">Engaged</option>
                    <option value="Closed">Closed</option>
                    <option value="Passed">Passed</option>
                </select>
            </div>
        </div>
        <div class="form-group"><label>Team Notes</label><textarea id="pf-teamNotes"></textarea></div>
        <div class="form-group"><label>Financials</label><textarea id="pf-financials"></textarea></div>
        <div class="form-group"><label>Market Overview</label><textarea id="pf-marketOverview"></textarea></div>
        <div class="form-group"><label>Competitors</label><textarea id="pf-competitors"></textarea></div>
        <div class="form-group"><label>Product Overview</label><textarea id="pf-productOverview"></textarea></div>
        <div class="form-group"><label>Differentiators</label><textarea id="pf-differentiators"></textarea></div>
        <div class="form-group"><label>Customers</label><textarea id="pf-customers"></textarea></div>
        <div class="form-group"><label>Churn</label><input id="pf-churn"></div>
        <div class="form-group"><label>GTM Strategy</label><textarea id="pf-gtmStrategy"></textarea></div>
        <div class="form-group"><label>Why M&A Fits</label><textarea id="pf-whyMAFits"></textarea></div>
        <div class="form-group"><label>Outreach Hook</label><textarea id="pf-outreachHook"></textarea></div>
        <div class="form-group"><label>Avera Debrief</label><textarea id="pf-averaDebrief"></textarea></div>
        <div class="form-group"><label>Additional Notes</label><textarea id="pf-additionalNotes"></textarea></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('prospectModal')">Cancel</button>
            <button class="btn-save" onclick="saveProspect()">Save</button>
        </div>
    </div>
</div>

<!-- Meeting Modal -->
<div class="modal-overlay" id="meetingModal" style="display:none" onclick="if(event.target===this)closeModal('meetingModal')">
    <div class="modal">
        <h2>Add Meeting Note</h2>
        <input type="hidden" id="mf-prospectId">
        <input type="hidden" id="mf-meetingId">
        <div class="form-row">
            <div class="form-group"><label>Date *</label><input type="date" id="mf-date"></div>
            <div class="form-group"></div>
        </div>
        <div class="form-group"><label>Company Attendees</label><input id="mf-companyAttendees" placeholder="e.g. Jane Doe (CEO), John Smith (VP Eng)"></div>
        <div class="form-group"><label>Avera Attendees</label><input id="mf-averaAttendees" placeholder="e.g. Ilene Chen"></div>
        <div class="form-group"><label>Notes *</label><textarea id="mf-notes" rows="6"></textarea></div>
        <div class="form-group">
            <label>Follow-Ups</label>
            <div class="followup-rows" id="mf-followups"></div>
            <button class="add-followup-btn" onclick="addFollowUpRow()">+ Add Follow-Up</button>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('meetingModal')">Cancel</button>
            <button class="btn-save" onclick="saveMeeting()">Save</button>
        </div>
    </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="importModal" style="display:none" onclick="if(event.target===this)closeModal('importModal')">
    <div class="modal">
        <h2>Import CSV</h2>
        <div class="import-area" onclick="document.getElementById('csvFile').click()">
            <p style="font-size:14px;color:var(--text-dim)">Click to select CSV file or drag & drop</p>
            <p style="font-size:12px;color:var(--text-dim);margin-top:8px">Expected format: avera-prospect-tracker.csv</p>
            <input type="file" id="csvFile" accept=".csv" onchange="handleCSVFile(this.files[0])">
        </div>
        <div id="importStatus" style="font-size:13px;margin-top:8px"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal('importModal')">Close</button>
        </div>
    </div>
</div>

<script>
// ── Data Layer ──
const STORAGE_KEY = 'avera-prospects';

function loadData() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { return []; }
}

function saveData(prospects) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(prospects));
}

function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

let prospects = loadData();
let selectedId = null;

// ── CSV Parser (RFC 4180) ──
function parseCSV(text) {
    const rows = [];
    let i = 0;
    const len = text.length;

    function parseField() {
        if (i >= len || text[i] === '\n' || text[i] === '\r') return '';
        if (text[i] === '"') {
            i++; // skip opening quote
            let field = '';
            while (i < len) {
                if (text[i] === '"') {
                    if (i + 1 < len && text[i + 1] === '"') {
                        field += '"';
                        i += 2;
                    } else {
                        i++; // skip closing quote
                        break;
                    }
                } else {
                    field += text[i];
                    i++;
                }
            }
            return field;
        }
        let field = '';
        while (i < len && text[i] !== ',' && text[i] !== '\n' && text[i] !== '\r') {
            field += text[i];
            i++;
        }
        return field;
    }

    while (i < len) {
        const row = [];
        while (true) {
            row.push(parseField());
            if (i < len && text[i] === ',') { i++; continue; }
            break;
        }
        // skip line endings
        if (i < len && text[i] === '\r') i++;
        if (i < len && text[i] === '\n') i++;
        if (row.length > 1 || row[0] !== '') rows.push(row);
    }
    return rows;
}

// ── CSV Import ──
const CSV_COL_MAP = {
    '#': null,
    'Company': 'companyName',
    'Website': 'website',
    'HQ': 'hq',
    'NYC-Based': 'nycBased',
    'Sector': 'sector',
    'Subsector': 'subsector',
    'Stage': 'stage',
    'Funding Amount': 'fundingAmount',
    'Funding Date': 'fundingDate',
    'Lead Investors': 'leadInvestors',
    'Lead Contact': 'leadContact',
    'Contact Title': 'contactTitle',
    'Why M&A Fits': 'whyMAFits',
    'Outreach Hook': 'outreachHook',
    'Status': 'status',
    'Last Action': 'additionalNotes',
    'Next Step': 'averaDebrief',
    'Notes': 'teamNotes'
};

function handleCSVFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const rows = parseCSV(e.target.result);
        if (rows.length < 2) {
            document.getElementById('importStatus').textContent = 'No data found in CSV.';
            return;
        }
        const headers = rows[0];
        const colIndices = {};
        headers.forEach((h, idx) => {
            const key = h.trim();
            if (CSV_COL_MAP[key] !== undefined) colIndices[key] = idx;
        });

        let imported = 0, skipped = 0;
        const existingNames = new Set(prospects.map(p => p.companyName.toLowerCase().trim()));

        for (let r = 1; r < rows.length; r++) {
            const row = rows[r];
            const nameIdx = colIndices['Company'];
            if (nameIdx === undefined) continue;
            const name = (row[nameIdx] || '').trim();
            if (!name) continue;
            if (existingNames.has(name.toLowerCase())) { skipped++; continue; }

            const prospect = { id: genId(), companyName: name, meetings: [] };
            for (const [csvCol, field] of Object.entries(CSV_COL_MAP)) {
                if (!field || csvCol === 'Company') continue;
                const idx = colIndices[csvCol];
                if (idx !== undefined) prospect[field] = (row[idx] || '').trim();
            }
            prospect.status = prospect.status || 'Researching';
            prospects.push(prospect);
            existingNames.add(name.toLowerCase());
            imported++;
        }

        saveData(prospects);
        populateSectorFilter();
        renderSidebar();
        document.getElementById('importStatus').innerHTML =
            `<span style="color:var(--green)">Imported ${imported} prospects.</span>` +
            (skipped ? ` <span style="color:var(--text-dim)">${skipped} duplicates skipped.</span>` : '');
    };
    reader.readAsText(file);
}

// ── Export JSON ──
function exportJSON() {
    const blob = new Blob([JSON.stringify(prospects, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'avera-prospects-backup.json';
    a.click();
    URL.revokeObjectURL(a.href);
}

// ── Sidebar Rendering ──
function getStatusClass(status) {
    return 'status-' + (status || 'researching').toLowerCase().replace(/\s+/g, '-');
}

function populateSectorFilter() {
    const sectors = [...new Set(prospects.map(p => p.sector).filter(Boolean))].sort();
    const sel = document.getElementById('sectorFilter');
    const current = sel.value;
    sel.innerHTML = '<option value="">All Sectors</option>' +
        sectors.map(s => `<option value="${s}"${s === current ? ' selected' : ''}>${s}</option>`).join('');
}

function getFilteredProspects() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const status = document.getElementById('statusFilter').value;
    const sector = document.getElementById('sectorFilter').value;
    return prospects.filter(p => {
        if (status && p.status !== status) return false;
        if (sector && p.sector !== sector) return false;
        if (q) {
            const hay = [p.companyName, p.sector, p.subsector, p.leadContact, p.hq].filter(Boolean).join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
        }
        return true;
    });
}

function renderSidebar() {
    const filtered = getFilteredProspects();
    const list = document.getElementById('prospectList');
    list.innerHTML = filtered.map(p => `
        <div class="prospect-item${p.id === selectedId ? ' active' : ''}" onclick="selectProspect('${p.id}')">
            <div class="prospect-item-name">${esc(p.companyName)}</div>
            <div class="prospect-item-meta">
                <span class="status-pill ${getStatusClass(p.status)}">${esc(p.status || 'Researching')}</span>
                <span>${esc(p.sector || '')}</span>
            </div>
        </div>
    `).join('');
    renderFollowUps();
}

function renderFollowUps() {
    const section = document.getElementById('followupsSection');
    const today = new Date(); today.setHours(0,0,0,0);
    const soon = new Date(today); soon.setDate(soon.getDate() + 3);
    const items = [];

    prospects.forEach(p => {
        (p.meetings || []).forEach(m => {
            (m.followUps || []).forEach(fu => {
                if (fu.completed) return;
                items.push({ ...fu, companyName: p.companyName, prospectId: p.id, meetingId: m.id });
            });
        });
    });

    items.sort((a, b) => {
        const da = a.deadline ? new Date(a.deadline) : new Date('9999-12-31');
        const db = b.deadline ? new Date(b.deadline) : new Date('9999-12-31');
        return da - db;
    });

    if (items.length === 0) {
        section.innerHTML = '';
        return;
    }

    section.innerHTML = `<div class="followups-header">Follow-Ups (${items.length})</div>` +
        items.map(fu => {
            let cls = 'upcoming';
            if (fu.deadline) {
                const d = new Date(fu.deadline + 'T00:00:00');
                if (d < today) cls = 'overdue';
                else if (d <= soon) cls = 'due-soon';
            }
            return `<div class="followup-item ${cls}" onclick="selectProspect('${fu.prospectId}')">
                <div class="followup-dot ${cls}"></div>
                <div class="followup-text">
                    <div class="followup-company">${esc(fu.companyName)}</div>
                    <div>${esc(fu.description)}</div>
                    <div class="followup-date">${fu.deadline ? formatDate(fu.deadline) : 'No deadline'}</div>
                </div>
            </div>`;
        }).join('');
}

// ── Detail View ──
function selectProspect(id) {
    selectedId = id;
    renderSidebar();
    renderDetail();
}

function renderDetail() {
    const p = prospects.find(pr => pr.id === selectedId);
    if (!p) {
        document.getElementById('mainContent').innerHTML = '<div class="empty-state"><span>&#128203;</span>Select a prospect</div>';
        return;
    }

    const fields = [
        ['Website', p.website ? `<a href="${ensureHttp(p.website)}" target="_blank">${esc(p.website)}</a>` : '—'],
        ['HQ', p.hq || '—'],
        ['NYC-Based', p.nycBased || '—'],
        ['Year Founded', p.yearFounded || '—'],
        ['Sector', p.sector || '—'],
        ['Subsector', p.subsector || '—'],
        ['Stage', p.stage || '—'],
        ['Funding Amount', p.fundingAmount || '—'],
        ['Funding Date', p.fundingDate || '—'],
        ['Lead Investors', p.leadInvestors || '—'],
        ['Lead Contact', p.leadContact || '—'],
        ['Contact Title', p.contactTitle || '—'],
    ];

    const longFields = [
        ['Team Notes', p.teamNotes],
        ['Financials', p.financials],
        ['Market Overview', p.marketOverview],
        ['Competitors', p.competitors],
        ['Product Overview', p.productOverview],
        ['Differentiators', p.differentiators],
        ['Customers', p.customers],
        ['Churn', p.churn],
        ['GTM Strategy', p.gtmStrategy],
        ['Why M&A Fits', p.whyMAFits],
        ['Outreach Hook', p.outreachHook],
        ['Avera Debrief', p.averaDebrief],
        ['Additional Notes', p.additionalNotes],
    ].filter(([, v]) => v);

    const meetings = (p.meetings || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    document.getElementById('mainContent').innerHTML = `
        <div class="profile-header">
            <div>
                <h2>${esc(p.companyName)}</h2>
                <span class="status-pill ${getStatusClass(p.status)}" style="margin-top:8px;display:inline-block">${esc(p.status || 'Researching')}</span>
            </div>
            <div class="profile-header-actions">
                <button class="btn-primary" onclick="openProspectModal('${p.id}')">Edit</button>
                <button class="btn-secondary" onclick="openMeetingModal('${p.id}')">+ Meeting</button>
                <button class="btn-secondary" style="color:var(--red)" onclick="deleteProspect('${p.id}')">Delete</button>
            </div>
        </div>
        <div class="profile-card">
            <h3>Company Profile</h3>
            <div class="profile-grid">
                ${fields.map(([label, val]) => `<div class="profile-field"><label>${label}</label><div class="value">${val}</div></div>`).join('')}
            </div>
        </div>
        ${longFields.length ? `<div class="profile-card">
            <h3>Notes & Analysis</h3>
            <div class="profile-grid">
                ${longFields.map(([label, val]) => `<div class="profile-field full"><label>${label}</label><div class="value">${esc(val)}</div></div>`).join('')}
            </div>
        </div>` : ''}
        <div class="meetings-header">
            <h3>Meeting Notes (${meetings.length})</h3>
            <button class="btn-primary" onclick="openMeetingModal('${p.id}')" style="font-size:13px;padding:6px 14px">+ Add Meeting</button>
        </div>
        ${meetings.length === 0 ? '<p style="color:var(--text-dim);font-size:14px">No meetings yet.</p>' :
            meetings.map(m => renderMeetingCard(p.id, m)).join('')}
    `;
}

function renderMeetingCard(prospectId, m) {
    const today = new Date(); today.setHours(0,0,0,0);
    const soon = new Date(today); soon.setDate(soon.getDate() + 3);

    return `<div class="meeting-card">
        <div class="meeting-card-header">
            <div class="meeting-date">${formatDate(m.date)}</div>
            <div>
                <button class="meeting-delete-btn" onclick="editMeeting('${prospectId}','${m.id}')">Edit</button>
                <button class="meeting-delete-btn" onclick="deleteMeeting('${prospectId}','${m.id}')">Delete</button>
            </div>
        </div>
        ${m.companyAttendees ? `<div class="meeting-attendees"><strong>Company:</strong> ${esc(m.companyAttendees)}</div>` : ''}
        ${m.averaAttendees ? `<div class="meeting-attendees"><strong>Avera:</strong> ${esc(m.averaAttendees)}</div>` : ''}
        <div class="meeting-notes">${esc(m.notes || '')}</div>
        ${(m.followUps || []).length ? `<ul class="followup-checklist">
            ${m.followUps.map(fu => {
                let dlClass = '';
                if (fu.deadline && !fu.completed) {
                    const d = new Date(fu.deadline + 'T00:00:00');
                    if (d < today) dlClass = 'overdue';
                    else if (d <= soon) dlClass = 'due-soon';
                }
                return `<li>
                    <input type="checkbox" ${fu.completed ? 'checked' : ''} onchange="toggleFollowUp('${prospectId}','${m.id}','${fu.id}',this.checked)">
                    <span class="${fu.completed ? 'completed' : ''}">${esc(fu.description)}</span>
                    ${fu.deadline ? `<span class="followup-deadline ${dlClass}">${formatDate(fu.deadline)}</span>` : ''}
                </li>`;
            }).join('')}
        </ul>` : ''}
    </div>`;
}

// ── Prospect CRUD ──
function openProspectModal(editId) {
    const modal = document.getElementById('prospectModal');
    const fields = ['companyName','website','hq','nycBased','sector','subsector','stage',
        'fundingAmount','fundingDate','leadInvestors','leadContact','contactTitle','yearFounded',
        'status','teamNotes','financials','marketOverview','competitors','productOverview',
        'differentiators','customers','churn','gtmStrategy','whyMAFits','outreachHook',
        'averaDebrief','additionalNotes'];

    if (editId) {
        const p = prospects.find(pr => pr.id === editId);
        document.getElementById('prospectModalTitle').textContent = 'Edit Prospect';
        document.getElementById('pf-id').value = editId;
        fields.forEach(f => {
            const el = document.getElementById('pf-' + f);
            if (el) el.value = p[f] || '';
        });
    } else {
        document.getElementById('prospectModalTitle').textContent = 'Add Prospect';
        document.getElementById('pf-id').value = '';
        fields.forEach(f => {
            const el = document.getElementById('pf-' + f);
            if (el) el.value = f === 'status' ? 'Researching' : '';
        });
    }
    modal.style.display = 'flex';
}

function saveProspect() {
    const name = document.getElementById('pf-companyName').value.trim();
    if (!name) { alert('Company name is required.'); return; }

    const id = document.getElementById('pf-id').value;
    const fields = ['companyName','website','hq','nycBased','sector','subsector','stage',
        'fundingAmount','fundingDate','leadInvestors','leadContact','contactTitle','yearFounded',
        'status','teamNotes','financials','marketOverview','competitors','productOverview',
        'differentiators','customers','churn','gtmStrategy','whyMAFits','outreachHook',
        'averaDebrief','additionalNotes'];

    if (id) {
        const p = prospects.find(pr => pr.id === id);
        fields.forEach(f => { p[f] = document.getElementById('pf-' + f).value.trim(); });
    } else {
        const p = { id: genId(), meetings: [] };
        fields.forEach(f => { p[f] = document.getElementById('pf-' + f).value.trim(); });
        prospects.push(p);
        selectedId = p.id;
    }

    saveData(prospects);
    populateSectorFilter();
    renderSidebar();
    renderDetail();
    closeModal('prospectModal');
}

function deleteProspect(id) {
    if (!confirm('Delete this prospect and all its meetings?')) return;
    prospects = prospects.filter(p => p.id !== id);
    if (selectedId === id) selectedId = null;
    saveData(prospects);
    populateSectorFilter();
    renderSidebar();
    if (selectedId) renderDetail();
    else document.getElementById('mainContent').innerHTML = '<div class="empty-state"><span>&#128203;</span>Select a prospect</div>';
}

// ── Meeting CRUD ──
function openMeetingModal(prospectId, meetingId) {
    document.getElementById('mf-prospectId').value = prospectId;
    document.getElementById('mf-meetingId').value = meetingId || '';
    const followupsContainer = document.getElementById('mf-followups');
    followupsContainer.innerHTML = '';

    if (meetingId) {
        const p = prospects.find(pr => pr.id === prospectId);
        const m = p.meetings.find(mt => mt.id === meetingId);
        document.getElementById('mf-date').value = m.date || '';
        document.getElementById('mf-companyAttendees').value = m.companyAttendees || '';
        document.getElementById('mf-averaAttendees').value = m.averaAttendees || '';
        document.getElementById('mf-notes').value = m.notes || '';
        (m.followUps || []).forEach(fu => addFollowUpRow(fu.description, fu.deadline));
    } else {
        document.getElementById('mf-date').value = new Date().toISOString().slice(0, 10);
        document.getElementById('mf-companyAttendees').value = '';
        document.getElementById('mf-averaAttendees').value = '';
        document.getElementById('mf-notes').value = '';
    }
    document.getElementById('meetingModal').style.display = 'flex';
}

function editMeeting(prospectId, meetingId) {
    openMeetingModal(prospectId, meetingId);
}

function addFollowUpRow(desc, deadline) {
    const container = document.getElementById('mf-followups');
    const row = document.createElement('div');
    row.className = 'followup-row';
    row.innerHTML = `
        <input type="text" placeholder="Follow-up description" value="${esc(desc || '')}">
        <input type="date" value="${deadline || ''}">
        <button class="remove-followup" onclick="this.parentElement.remove()">&times;</button>
    `;
    container.appendChild(row);
}

function saveMeeting() {
    const prospectId = document.getElementById('mf-prospectId').value;
    const meetingId = document.getElementById('mf-meetingId').value;
    const date = document.getElementById('mf-date').value;
    const notes = document.getElementById('mf-notes').value.trim();
    if (!date || !notes) { alert('Date and notes are required.'); return; }

    const p = prospects.find(pr => pr.id === prospectId);
    const followUpRows = document.querySelectorAll('#mf-followups .followup-row');
    const followUps = [];
    followUpRows.forEach(row => {
        const desc = row.querySelector('input[type="text"]').value.trim();
        const dl = row.querySelector('input[type="date"]').value;
        if (desc) followUps.push({ id: genId(), description: desc, deadline: dl, completed: false });
    });

    if (meetingId) {
        const m = p.meetings.find(mt => mt.id === meetingId);
        m.date = date;
        m.companyAttendees = document.getElementById('mf-companyAttendees').value.trim();
        m.averaAttendees = document.getElementById('mf-averaAttendees').value.trim();
        m.notes = notes;
        // Preserve completion state for existing follow-ups
        const oldFUs = m.followUps || [];
        m.followUps = followUps.map(fu => {
            const old = oldFUs.find(o => o.description === fu.description && o.deadline === fu.deadline);
            if (old) fu.completed = old.completed;
            return fu;
        });
    } else {
        p.meetings.push({
            id: genId(),
            date,
            companyAttendees: document.getElementById('mf-companyAttendees').value.trim(),
            averaAttendees: document.getElementById('mf-averaAttendees').value.trim(),
            notes,
            followUps
        });
    }

    saveData(prospects);
    renderSidebar();
    renderDetail();
    closeModal('meetingModal');
}

function deleteMeeting(prospectId, meetingId) {
    if (!confirm('Delete this meeting note?')) return;
    const p = prospects.find(pr => pr.id === prospectId);
    p.meetings = p.meetings.filter(m => m.id !== meetingId);
    saveData(prospects);
    renderSidebar();
    renderDetail();
}

function toggleFollowUp(prospectId, meetingId, followUpId, checked) {
    const p = prospects.find(pr => pr.id === prospectId);
    const m = p.meetings.find(mt => mt.id === meetingId);
    const fu = m.followUps.find(f => f.id === followUpId);
    fu.completed = checked;
    saveData(prospects);
    renderSidebar();
    renderDetail();
}

// ── Import Modal ──
function openImportModal() {
    document.getElementById('importStatus').innerHTML = '';
    document.getElementById('csvFile').value = '';
    document.getElementById('importModal').style.display = 'flex';
}

// ── Helpers ──
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function esc(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function ensureHttp(url) {
    if (!url) return '';
    return url.match(/^https?:\/\//) ? url : 'https://' + url;
}

function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ── Init ──
populateSectorFilter();
renderSidebar();
</script>
